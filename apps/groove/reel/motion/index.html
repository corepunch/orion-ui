<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fred;font-weight:600;src:url(assets/fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fred;font-weight:700;src:url(assets/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Int;font-weight:500;src:url(assets/inter-latin-500-normal.woff2)}
@font-face{font-family:Int;font-weight:700;src:url(assets/inter-latin-700-normal.woff2)}
@font-face{font-family:Int;font-weight:800;src:url(assets/inter-latin-800-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
<script src="sync.js"></script>
<script src="icons.js"></script>
</head><body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
const W=1920,H=1080,S=window.SYNC,FPS=60;
const b=60/140, B=4*b;               // beat, bar (seconds)
const out=document.getElementById('out'), octx=out.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const buf=mk(W,H), ctx=buf.getContext('2d');
const tmp=mk(W,H), tctx=tmp.getContext('2d');

// ───────── math / easing ─────────
const clamp=(x,a=0,c=1)=>x<a?a:x>c?c:x, lerp=(a,c,t)=>a+(c-a)*t;
const prog=(t,a,c)=>clamp((t-a)/(c-a));
const E={
  outCubic:t=>1-Math.pow(1-t,3), inCubic:t=>t*t*t, inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t), inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outBack:(t,s=1.70158)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2),
  inBack:(t,s=1.70158)=>(s+1)*t*t*t-s*t*t,
  outQuint:t=>1-Math.pow(1-t,5), inQuad:t=>t*t, outQuad:t=>1-(1-t)*(1-t),
};
function spring(t,f=3,z=.4){ if(t<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function springV(t,f,z){ const d=1/600; return (spring(t+d,f,z)-spring(t-d,f,z))/(2*d); }
// squash & stretch from a spring: returns [sx,sy,s]
function pop(t,f=3,z=.38,k=.06){ if(t<=0) return [0,0,0]; const s=spring(t,f,z), v=springV(t,f,z)*k;
  const st=clamp(v,-.35,.35); return [s*(1-st*.6), s*(1+st), s]; }
function hash(n){ n=Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); }
const rnd=(i,j=0)=>hash(i*91.17+j*13.37+.5);
function noise1(t,seed){ return Math.sin(t*13.1+seed)*.5+Math.sin(t*23.7+seed*2.1)*.3+Math.sin(t*41.3+seed*3.7)*.2; }

// ───────── colours (category_color in apps/groove/library.c) ─────────
const CAT=['#1aa6f2','#ff7a2a','#ff4fa0','#f2d02c','#ff7f5e','#5cc6f8','#ffa12c','#e64fd8','#a047f2','#ffb21e','#36c95c','#ff4f6c','#1fd2b2','#8ad13f','#f2553d','#ff63a6','#7c8cff','#6c5cff'];
const CATNAME=['Drums','Kicks','Snares','Hats','Claps','Cymbals','Perc','Fills','Bass','Keys','Organ','Guitar','Synth','Pads','Stabs','Vocals','Scratch','FX'];
const INK='#1b0f3b';
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,k){ const [r,g,bb]=hex2rgb(h); const f=x=>Math.round(k>0?x+(255-x)*k:x*(1+k));
  return `rgb(${f(r)},${f(g)},${f(bb)})`; }
function rgba(h,a){ const [r,g,bb]=hex2rgb(h); return `rgba(${r},${g},${bb},${a})`; }

// ───────── assets ─────────
const IMG={};
function loadImg(k,src){ return new Promise(r=>{const i=new Image(); i.onload=()=>{IMG[k]=i;r();}; i.src=src;}); }
const loads=[loadImg('hero','assets/icon-transparent.png')];
// category pictograms come straight from the app's atlas (6×3 cells of 128 px)
loads.push(loadImg('atlas','../../share/icons/class-pictograms.png').then(()=>{ for(let i=0;i<18;i++){ const c=mk(128,128);
  c.getContext('2d').drawImage(IMG.atlas,(i%6)*128,Math.floor(i/6)*128,128,128,0,0,128,128); IMG['p'+i]=c; } }));
const PHP={}; for(const k in PH) PHP[k]=new Path2D(PH[k][0]);

// ───────── sync helpers ─────────
const fr=t=>clamp(Math.round(t*FPS),0,S.master.length-1);
const env=(k,t)=>S.env[k][fr(t)]||0;
const CATENV=['drums','drums','drums','drums','drums','cym','drums','drums','bass','keys','keys','guitar','pad','pad','keys','vox','fx','fx'];
const TRACKENV=['drums','bass','keys','guitar','pad','vox','fx','cym'];
// kick grid where the floor plays
function kickPulse(t,decay=10){ let p=0;
  for(const [a,c] of [[2*B,8*B],[10*B,16*B],[16*B,16*B+.01]]){
    if(t<a) continue; const n=Math.floor((Math.min(t,c+b*.999)-a)/b); const tk=a+n*b; if(tk>c) continue;
    if(t>=tk) p=Math.max(p,Math.exp(-(t-tk)*decay)); }
  return p; }
function beatPulse(t,decay=8){ const tk=Math.floor(t/b)*b; return Math.exp(-(t-tk)*decay); }

// ───────── drawing primitives ─────────
function rr(c,x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,Math.max(0,Math.min(r,h/2,w/2))); }
const shadowCache={};
function softShadow(w,h,r,blur){ const key=[w,h,r,blur].map(Math.round).join('_'); if(shadowCache[key]) return shadowCache[key];
  const p=Math.ceil(blur*2.5), c=mk(Math.ceil(w)+p*2,Math.ceil(h)+p*2), x=c.getContext('2d');
  x.filter=`blur(${blur}px)`; x.fillStyle='rgba(0,0,0,1)'; rr(x,p,p,w,h,r); x.fill(); c.pad=p; shadowCache[key]=c; return c; }

// glossy "plastic" card, after draw_plastic_card / paint_block_card
const cardCache={};
function cardSprite(cat,name,peaks,w,h,opt={}){
  const key=`${cat}|${name}|${w}|${h}|${opt.noLabel?1:0}|${opt.noWave?1:0}`; if(cardCache[key]) return cardCache[key];
  const pad=Math.round(h*.25), c=mk(w+pad*2,h+pad*2), x=c.getContext('2d'); x.translate(pad,pad);
  const col=CAT[cat], r=h*.2;
  const sh=softShadow(w,h,r,h*.09); x.globalAlpha=.45; x.drawImage(sh,-sh.pad,-sh.pad+h*.08); x.globalAlpha=1;
  // body
  let g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,shade(col,.28)); g.addColorStop(.5,col); g.addColorStop(1,shade(col,-.28));
  rr(x,0,0,w,h,r); x.fillStyle=g; x.fill();
  x.lineWidth=Math.max(1.5,h*.035); x.strokeStyle=shade(col,-.45); x.stroke();
  // waveform
  const ix=h*.06, iw=w-ix*2;
  if(peaks && !opt.noWave){ x.save(); rr(x,ix,ix,iw,h-ix*2,r*.8); x.clip();
    const n=peaks.length, cw=iw/n, mid=h/2, amp=h*.36; x.fillStyle='rgba(255,255,255,.42)';
    for(let i=0;i<n;i++){ const a=Math.max(.04,peaks[i])*amp; x.fillRect(ix+i*cw+cw*.18,mid-a,Math.max(1,cw*.64),a*2); }
    x.restore(); }
  // gloss
  x.save(); rr(x,0,0,w,h,r); x.clip();
  g=x.createLinearGradient(0,0,0,h*.55); g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  rr(x,h*.08,h*.05,w-h*.16,h*.42,r*.7); x.fillStyle=g; x.fill();
  x.fillStyle='rgba(0,0,0,.14)'; x.fillRect(0,h*.86,w,h*.14); x.restore();
  // pictogram
  const is=h*.78; x.drawImage(IMG['p'+cat],h*.04,(h-is)/2,is,is);
  // label capsule
  if(!opt.noLabel && name){ const fs=Math.round(h*.19); x.font=`700 ${fs}px Int`; const tw=x.measureText(name).width;
    const lx=Math.min(is+h*.08,w-tw-fs*1.1-h*.06), ly=h*.07, lw=Math.min(tw+fs*1.0,w-lx-h*.06);
    if(lw>fs*2){ rr(x,lx,ly,lw,fs*1.35,fs*.7); x.fillStyle='rgba(10,6,24,.72)'; x.fill();
      x.save(); x.beginPath(); x.rect(lx,ly,lw-fs*.3,fs*1.35); x.clip(); x.fillStyle='#fff'; x.textBaseline='middle'; x.fillText(name,lx+fs*.5,ly+fs*.7); x.restore(); } }
  c.pad=pad; cardCache[key]=c; return c; }
function drawCard(c,cat,name,peaks,x,y,w,h,opt={}){
  // base resolution 2x the largest on-screen size we expect
  const bh=opt.bh||96, bw=Math.round(w/h*bh); const sp=cardSprite(cat,name,peaks,bw,bh,opt); const k=h/bh;
  c.drawImage(sp,x-sp.pad*k,y-sp.pad*k,sp.width*k,sp.height*k); }

// sticker typography (thick ink outline + extrusion + gradient), like the icon art
function sticker(c,text,x,y,size,fill,o={}){
  c.save(); c.font=`700 ${size}px Fred`; c.textAlign=o.align||'center'; c.textBaseline='alphabetic'; c.lineJoin='round';
  const depth=o.depth??size*.07, ink=o.ink||INK;
  if(o.glow){ c.save(); c.shadowColor=o.glow; c.shadowBlur=o.glowR||60; c.fillStyle=o.glow; c.globalAlpha*=o.glowA??.9; c.lineWidth=size*.16; c.strokeStyle=o.glow; c.strokeText(text,x,y); c.restore(); }
  c.fillStyle=ink; c.strokeStyle=ink; c.lineWidth=size*.16;
  for(let i=depth;i>0;i-=Math.max(1,depth/6)){ c.strokeText(text,x,y+i); c.fillText(text,x,y+i); }
  c.strokeText(text,x,y);
  const g=c.createLinearGradient(0,y-size*.75,0,y+size*.05); g.addColorStop(0,shade(fill,.35)); g.addColorStop(.55,fill); g.addColorStop(1,shade(fill,-.25));
  c.fillStyle=g; c.fillText(text,x,y);
  if(o.gloss!==false){ c.save(); c.beginPath(); c.rect(-9999,y-size*.78,99999,size*.3); c.clip(); c.fillStyle='rgba(255,255,255,.35)'; c.fillText(text,x,y); c.restore(); }
  c.restore(); }
function textW(text,size,font='700 %px Fred'){ ctx.save(); ctx.font=font.replace('%',size); const w=ctx.measureText(text).width; ctx.restore(); return w; }

// per-letter word with spring drops
function letters(c,word,cx,base,size,t0,step,colors,o={}){
  c.save(); c.font=`700 ${size}px Fred`; const ws=[...word].map(ch=>c.measureText(ch).width); const tot=ws.reduce((a,v)=>a+v,0)+(word.length-1)*size*(o.track??.02);
  let x=cx-tot/2; c.restore();
  [...word].forEach((ch,i)=>{ const lt=o.time?o.time[i]:t0+i*step; const tt=o.t-lt; const w=ws[i];
    if(tt>0){ const [sx,sy]=pop(tt,o.f||2.6,o.z||.32,o.k||.05); const drop=(1-E.outCubic(clamp(tt/.18)))*(o.from??-380);
      const rot=(1-spring(tt,2,.3))*((rnd(i,7)-.5)*.9);
      const bounce=(o.pulse?o.pulse(i):0);
      c.save(); c.translate(x+w/2,base+drop); c.rotate(rot); c.scale(sx*(1+bounce),sy*(1+bounce));
      sticker(c,ch,0,0,size,colors[i%colors.length],{depth:o.depth}); c.restore(); }
    x+=w+size*(o.track??.02); }); }

// ripple / shockwave ring
function ring(c,x,y,tt,col,maxR=600,dur=.9,lw=18){ if(tt<0||tt>dur) return; const p=tt/dur, r=E.outExpo(p)*maxR;
  c.save(); c.globalAlpha=(1-p); c.strokeStyle=col; c.lineWidth=lw*(1-p)+1; c.beginPath(); c.arc(x,y,r,0,7); c.stroke(); c.restore(); }
// four-point sparkle
function star(c,x,y,r,col,rot=0){ c.save(); c.translate(x,y); c.rotate(rot); c.fillStyle=col; c.beginPath();
  for(let i=0;i<8;i++){ const a=i*Math.PI/4, rad=i%2?r*.28:r; c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} c.closePath(); c.fill(); c.restore(); }
// confetti/particle burst, stateless: position from spawn time
function burst(c,x,y,tt,n,seed,o={}){ if(tt<0||tt>(o.life||1.2)) return; const life=o.life||1.2;
  for(let i=0;i<n;i++){ const a=rnd(seed,i)*Math.PI*2, sp=(o.speed||900)*(.35+rnd(seed,i+50)*.8), g=o.grav??900;
    const px=x+Math.cos(a)*sp*tt*(1-tt/(life*2.2)), py=y+Math.sin(a)*sp*tt*(1-tt/(life*2.2))+g*tt*tt*.5;
    const p=tt/life, s=(o.size||14)*(.5+rnd(seed,i+9))*(1-p*p), col=(o.cols||CAT)[Math.floor(rnd(seed,i+3)*(o.cols||CAT).length)];
    c.save(); c.globalAlpha=1-p*p; c.translate(px,py); c.rotate(tt*(rnd(seed,i+7)-.5)*14);
    if(o.shape==='star') star(c,0,0,s,col); else if(o.shape==='dot'){ c.fillStyle=col; c.beginPath(); c.arc(0,0,s*.5,0,7); c.fill(); }
    else { c.fillStyle=col; rr(c,-s/2,-s*.3,s,s*.6,s*.15); c.fill(); }
    c.restore(); } }

// ───────── backgrounds ─────────
function bgNight(c,t,tint='#2b1673'){ const g=c.createRadialGradient(W/2,H*.45,50,W/2,H/2,W*.75); g.addColorStop(0,tint); g.addColorStop(.6,'#120a3a'); g.addColorStop(1,'#07051a');
  c.fillStyle=g; c.fillRect(0,0,W,H); }
function dotGrid(c,t,alpha=.12,col='#ffffff'){ const k=kickPulse(t); c.save(); c.fillStyle=col; const sp=64, off=(t*20)%sp;
  for(let y=-sp;y<H+sp;y+=sp) for(let x=-sp;x<W+sp;x+=sp){ const dx=x+off-W/2, dy=y-H/2, d=Math.hypot(dx,dy);
    const wave=Math.max(0,1-Math.abs(d-(1-k)*900)/220)*k; c.globalAlpha=alpha*(.5+wave*2.5); const r=2+wave*4; c.fillRect(x+off-r/2,y-r/2,r,r); }
  c.restore(); }
function bgBurst(c,t,cx=W/2,cy=H/2,rot=0,cols=['#7fe6ff','#16a8f5','#0753c2']){ const g=c.createRadialGradient(cx,cy,20,cx,cy,W*.8);
  g.addColorStop(0,cols[0]); g.addColorStop(.45,cols[1]); g.addColorStop(1,cols[2]); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.save(); c.translate(cx,cy); c.rotate(rot); c.fillStyle='rgba(255,255,255,.10)'; const n=18;
  for(let i=0;i<n;i++){ const a=i*2*Math.PI/n; c.beginPath(); c.moveTo(0,0); c.arc(0,0,2400,a,a+Math.PI/n); c.closePath(); c.fill(); }
  c.restore(); }

// ───────── complete app icon ─────────
function drawHero(c,o){ // x,y anchor icon point 512,700; scale and rotate the intact artwork.
  c.save(); c.translate(o.x,o.y); c.rotate(o.rot||0); c.scale((o.s??1)*(o.sx??1),(o.s??1)*(o.sy??1)); c.translate(-512,-700);
  c.drawImage(IMG.hero,0,0,1024,1024);
  c.restore(); }

// ───────── HUD ─────────
function hud(c,t,alpha){ if(alpha<=0) return; c.save(); c.globalAlpha=alpha; c.fillStyle='rgba(255,255,255,.85)'; c.font='700 17px Int'; c.textBaseline='middle';
  c.fillText('GROOVE',56,52); c.globalAlpha=alpha*.55; c.font='500 17px Int'; c.fillText('MUSIC IN BLOCKS',150,52);
  c.textAlign='right'; c.globalAlpha=alpha*.85; c.font='700 17px Int'; c.fillText('140 BPM',W-130,52);
  const bt=Math.floor(t/b)%4; for(let i=0;i<4;i++){ const on=i===bt; const p=on?beatPulse(t,6):0; c.globalAlpha=alpha*(on?1:.3);
    c.fillStyle=on?'#ffd21e':'#fff'; c.beginPath(); c.arc(W-108+i*18,52,4+p*3,0,7); c.fill(); }
  const secs=[[0,'01  HELLO'],[2*B,'02  GROOVE'],[4*B,'03  SOUNDS'],[8*B,'04  ARRANGE'],[10*B,'05  PLAY'],[14*B,'06  IPAD']];
  let lab=''; let st=0; for(const [a,l] of secs) if(t>=a){lab=l; st=a;}
  const sp=E.outCubic(prog(t,st,st+.25)); c.textAlign='left'; c.globalAlpha=alpha*.8; c.fillStyle='#fff'; c.font='700 17px Int';
  c.save(); c.beginPath(); c.rect(50,H-70,400,30); c.clip(); c.fillText(lab,56,H-55+(1-sp)*30); c.restore();
  const tc=`00:${String(Math.floor(t)).padStart(2,'0')}:${String(Math.floor((t%1)*FPS)).padStart(2,'0')}`; c.textAlign='right'; c.globalAlpha=alpha*.55; c.font='500 17px Int'; c.fillText(tc,W-56,H-55);
  c.globalAlpha=alpha*.25; c.fillStyle='#fff'; c.fillRect(56,H-34,W-112,2); c.globalAlpha=alpha*.9; c.fillStyle='#ffd21e'; c.fillRect(56,H-34,(W-112)*t/30,2);
  c.restore(); }

// ───────── app model (apps/groove layout: 1180×760) ─────────
const APP={w:1180,h:760,menu:26,ruler:22,lane:54,head:32,libY:480};
const BARPX=(APP.w-APP.head)/18;
const trackColor=[]; for(let tr=0;tr<8;tr++){ const c0=S.clips.filter(c=>c.track===tr).sort((a,c)=>a.start-c.start)[0]; trackColor[tr]=c0?CAT[S.blocks[c0.block].cat]:'#888'; }
function clipRect(cl){ return {x:APP.head+cl.start*BARPX, y:APP.menu+APP.ruler+cl.track*APP.lane+3, w:cl.bars*BARPX-2, h:APP.lane-6}; }
const FAMS=[[0,'Loops'],[7,'Fills'],[8,'Bass'],[11,'Guitar'],[12,'Synth'],[13,'Pads'],[14,'Stabs'],[15,'Vocals'],[16,'Scratch'],[17,'FX']];
// library pages shown in the bin, per family
function libPage(cats){ return S.lib.filter(id=>cats.includes(S.blocks[id].cat)); }
const PAGES=[ libPage([0,1,2,3,4,5,6]), libPage([8,9,10]), libPage([11,12,13]), libPage([14,15,16,17]) ];

// draws the whole app in app space. o: {t, play(bars), assemble(0..1 per part fn), litClips}
function drawApp(c,o){
  const t=o.t, A=o.asm||(()=>1);
  const part=(id,fn)=>{ const a=A(id); if(a<=0) return; c.save(); if(a<1){
      if(id==='win'){ const s=.55+.45*E.outBack(a,2.2); c.translate(APP.w/2,APP.h/2); c.scale(s,s); c.translate(-APP.w/2,-APP.h/2); }
      else { const r=rnd(id.length*3.1+id.charCodeAt(0),1)*Math.PI*2, d=(1-E.outCubic(a))*520; c.translate(Math.cos(r)*d,Math.sin(r)*d*0.7);
        c.translate(APP.w/2,APP.h/2); c.rotate((1-E.outBack(a))*(rnd(id.length,2)-.5)*.5); c.translate(-APP.w/2,-APP.h/2); }
      c.globalAlpha=clamp(a*3); }
    fn(); c.restore(); };
  // window
  part('win',()=>{ const sh=softShadow(APP.w,APP.h,22,40); c.globalAlpha*=.6; c.drawImage(sh,-sh.pad,-sh.pad+30); c.globalAlpha=1;
    rr(c,0,0,APP.w,APP.h,20); c.fillStyle='#1d1a2e'; c.fill(); c.save(); rr(c,0,0,APP.w,APP.h,20); c.clip();
    c.fillStyle='#141223'; c.fillRect(0,APP.libY,APP.w,APP.h-APP.libY); c.restore();
    rr(c,0,0,APP.w,APP.h,20); c.strokeStyle='rgba(255,255,255,.12)'; c.lineWidth=2; c.stroke(); });
  part('menu',()=>{ c.save(); rr(c,0,0,APP.w,APP.h,20); c.clip(); c.fillStyle='#262338'; c.fillRect(0,0,APP.w,APP.menu); c.restore();
    c.fillStyle='#fff'; c.font='600 13px Int'; c.textBaseline='middle'; let x=74;
    ['#ff5f57','#febc2e','#28c840'].forEach((col,i)=>{ c.fillStyle=col; c.beginPath(); c.arc(18+i*17,13,5.5,0,7); c.fill(); });
    c.fillStyle='rgba(255,255,255,.9)'; c.font='700 13px Int'; c.fillText('Groove',x,13); x+=62; c.font='500 13px Int'; c.fillStyle='rgba(255,255,255,.7)';
    for(const m of ['File','Edit','Transport','Window']){ c.fillText(m,x,13); x+=c.measureText(m).width+18; } });
  // sheet
  part('sheet',()=>{ const top=APP.menu, rh=APP.ruler;
    c.fillStyle='#211e33'; c.fillRect(0,top,APP.w,rh); c.fillStyle='rgba(255,255,255,.55)'; c.font='600 11px Int'; c.textBaseline='middle';
    for(let i=0;i<18;i++){ const x=APP.head+i*BARPX; c.fillRect(x,top+rh-8,1,8); c.fillText(String(i+1),x+4,top+rh/2); }
    for(let tr=0;tr<8;tr++){ const y=top+rh+tr*APP.lane; c.fillStyle=tr%2?'#1b1829':'#1f1c30'; c.fillRect(APP.head,y,APP.w-APP.head,APP.lane);
      c.fillStyle='#262338'; c.fillRect(0,y,APP.head,APP.lane); c.fillStyle=trackColor[tr]; rr(c,6,y+8,APP.head-12,APP.lane-16,5); c.fill(); }

  // cursor carrying the first clip (DRAG)
  const f=BUILD[0]; const r0=clipRect(f.c); const dragT=prog(t,t0+.15,14.5);
  if(t<14.62){ const p=E.inOutCubic(dragT); const sx=lerp(APP.w+260,r0.x+r0.w*.6,p), sy=lerp(-150,r0.y-40,p)-Math.sin(p*Math.PI)*120;
    const vx=-(APP.w+260-r0.x)*.9; const tilt=Math.sin(p*Math.PI)*-.18; const bk=S.blocks[f.c.block];
    if(t<14.571-.12){ c.save(); c.translate(sx,sy); c.rotate(tilt); c.scale(1.08,1.08); drawCard(c,bk.cat,bk.name,bk.peaks,-r0.w*.6,-r0.h/2,r0.w,r0.h,{bh:64}); c.restore(); }
    // pointer
    c.save(); c.translate(sx+10,sy+10); c.scale(1.4,1.4); c.beginPath(); c.moveTo(0,0); c.lineTo(0,26); c.lineTo(7,20); c.lineTo(12,31); c.lineTo(17,29); c.lineTo(12,18); c.lineTo(21,18); c.closePath();
    c.fillStyle='#fff'; c.fill(); c.lineWidth=2; c.strokeStyle=INK; c.stroke(); c.restore(); }
  c.restore();
  // words
  const words=[['DRAG.',8*B,'#ffffff'],['DROP.',14.571,'#ffd21e'],["LET'S GO!",15.441,'#ff4fa0']];
  let cur=null,ci=0; words.forEach((w,i)=>{ if(t>=w[1]){cur=w;ci=i;} });
  if(cur && t<16.71){ const tt=t-cur[1]; const [sx,sy]=pop(tt,3,.33,.06); const v=env('vox',t);
    c.save(); c.translate(W/2,150+push*-20); c.scale(sx*(1+v*.06+push*.25),sy*(1+v*.06+push*.25)); sticker(c,cur[0],0,60,ci===2?180:165,cur[2],{depth:16}); c.restore(); }
  // play button grows on the riser
  if(t>15.43){ const pp=spring(t-15.43,2.4,.4); const g=(1+push*1.6)*(1-imp); c.save(); c.translate(W/2,H/2+170); c.scale(pp*g,pp*g);
    c.globalAlpha=.6; ring(c,0,0,(t-15.43)%b,'#fff',260,b,8); c.globalAlpha=1;
    c.beginPath(); c.arc(0,0,92,0,7); const gg=c.createLinearGradient(0,-92,0,92); gg.addColorStop(0,'#ffa25e'); gg.addColorStop(1,'#ff5a1a'); c.fillStyle=gg; c.fill();
    c.lineWidth=8; c.strokeStyle=INK; c.stroke(); c.scale(.55,.55); c.translate(-128+10,-128); c.fillStyle='#fff'; c.fill(PHP.play); c.restore(); }
  // implode to white
  if(t>16.71){ const p=E.inExpo(prog(t,16.71,10*B)); c.save(); c.globalAlpha=p; c.fillStyle='#fff'; c.fillRect(0,0,W,H); c.restore(); }
}

// S5 10B → 16B : drop. The app assembles, plays, camera choreography
function asmFn(t){ const t0=10*B;
  const order={win:0,menu:.05,sheet:.08,lib:.1,transport:.16,tabs:.2,playhead:.3};
  return id=>{ let d=order[id]; if(d===undefined){ if(id.startsWith('clip:')){ const i=+id.slice(5); d=.1+ (S.clips[i].start/18)*.35+ S.clips[i].track*.012; }
      else if(id.startsWith('card:')){ const i=+id.slice(5); d=.25+i*.018; } else d=.2; }
    return clamp((t-t0-d)/.45); }; }
function scene5(c,t){
  const t0=10*B; const k=kickPulse(t);
  // backgrounds: indigo + moving blobs in category colours
  bgNight(c,t,'#2a1580');
  c.save(); c.globalCompositeOperation='lighter'; for(let i=0;i<5;i++){ const x=W/2+Math.sin(t*.6+i*1.7)*700, y=H/2+Math.cos(t*.5+i*2.3)*380; const g=c.createRadialGradient(x,y,0,x,y,520);
    g.addColorStop(0,rgba(CAT[[0,2,11,12,15][i]],.22+k*.1)); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,W,H); } c.restore();
  dotGrid(c,t,.08);
  const play=t/B; // the playhead IS the soundtrack position
  // camera keys
  const tA=t0, tL=12*B, tI=14*B;
  let zoom, cx, cy, rot, ox=0, oy=0;
  const close=E.inOutCubic(prog(t,tL-.25,tL+.35)), back=E.inOutExpo(prog(t,tI-.1,tI+.7));
  // wide
  const wz=lerp(1.2,1.34,prog(t,tA,tL)); const wcx=APP.w/2, wcy=APP.h/2;
  // close-up follows playhead
  const phx=APP.head+play*BARPX; const czx=Math.min(phx-80, APP.w-300), cz=2.25;
  zoom=lerp(wz,cz,close); cx=lerp(wcx,czx,close); cy=lerp(wcy,APP.menu+APP.ruler+3.6*APP.lane,close); rot=lerp(-.035+prog(t,tA,tL)*.035,.0,close);
  // iPad pull back
  const iz=lerp(.78,.86,prog(t,tI,16*B));
  zoom=lerp(zoom,iz,back); cx=lerp(cx,APP.w/2,back); cy=lerp(cy,APP.h/2,back); ox=lerp(0,-250,back);
  const bump=1+k*.018; const sh=Math.exp(-(t-t0)*5)*26; const shx=noise1(t*4,3)*sh, shy=noise1(t*4,4)*sh;
  const fam=Math.floor(clamp((t-t0)/B,0,9)); const famT=(t-t0)/B-fam;
  c.save(); c.translate(W/2+ox+shx,H/2+oy+shy+back*20); c.rotate(rot+back*Math.sin(t*1.3)*.02); c.scale(zoom*bump,zoom*bump);
  // device wobble (fake 3D)
  if(back>0){ const wob=Math.sin(t*2.2)*.04*back; c.transform(1,wob*.3,0,1,0,0); }
  c.translate(-cx,-cy);
  if(back>0){ c.save(); c.globalAlpha=back; ipad(c,APP.w,APP.h); c.restore(); }
  const page=fam%4, prevPage=(fam+3)%4, flip=fam===0?1:E.inOutCubic(clamp(famT/.3));
  drawApp(c,{t,asm:asmFn(t),play,playing:true,family:[0,2,3,7][page],page,prevPage:fam?prevPage:undefined,flip,reactive:true});
  c.restore();
  // callouts
  const calls=[['580+','loops & samples',CAT[0],11*B,'p0',[300,250]],['18','instruments',CAT[11],11*B+b,'p11',[1630,330]],['8','tracks to fill',CAT[15],11*B+2*b,'p15',[1580,820]]];
  calls.forEach(([n,lab,col,ts,ic,[x,y]],i)=>{ const tt=t-ts; const outp=E.inBack(prog(t,12*B-.35,12*B-.05),2); if(tt<0||outp>=1) return;
    const [sx,sy]=pop(tt,2.8,.36,.05); const sc=(1-outp); c.save(); c.translate(x,y); c.rotate((i-1)*.04); c.scale(sx*sc,sy*sc);
    const w=330,h=120; const shd=softShadow(w,h,30,18); c.globalAlpha=.4; c.drawImage(shd,-w/2-shd.pad,-h/2-shd.pad+14); c.globalAlpha=1;
    rr(c,-w/2,-h/2,w,h,30); c.fillStyle='#fff'; c.fill(); c.drawImage(IMG[ic],-w/2+8,-h/2+4,112,112);
    c.fillStyle=col; c.font='700 62px Fred'; c.textBaseline='alphabetic'; c.fillText(n,-w/2+124,8); c.fillStyle=INK; c.font='700 21px Int'; c.fillText(lab,-w/2+128,40); c.restore(); });
  // LIGHT THE NIGHT
  const lw=[['LIGHT',20.608],['THE',21.002],['NIGHT',21.432]];
  lw.forEach(([w,ts],i)=>{ const tt=t-ts; const ex=E.inBack(prog(t,23.55,23.95),2); if(tt<0||ex>=1) return; const [sx,sy]=pop(tt,3,.34,.06);
    c.save(); c.translate(150,300+i*170); c.scale(sx*(1-ex),sy*(1-ex)); c.rotate(-.03);
    const v=env('vox',t); sticker(c,w,0,0,170,i===2?'#ffd21e':'#ffffff',{align:'left',depth:16,glow:i===2?'#ff9d1e':'#8f6bff',glowR:50+v*60,glowA:1}); c.restore(); });
  // iPad section: orbiting pictograms + headline
  if(back>0){ for(let i=0;i<18;i++){ const a=t*.9+i*Math.PI*2/18; const ex=1+E.inBack(prog(t,16*B-.25,16*B),2)*2; const depth=Math.sin(a);
      if(depth>0) continue; } }
  if(t>tI){ const words=[['Drag.',tI+.45,'#ffffff'],['Drop.',tI+.45+b,'#ffd21e'],['Groove.',tI+.45+2*b,'#ff7a2a']];
    words.forEach(([w,ts,col],i)=>{ const tt=t-ts; if(tt<0) return; const [sx,sy]=pop(tt,2.8,.34,.06); const ex=E.inBack(prog(t,16*B-.2,16*B),2);
      c.save(); c.translate(1360,400+i*145); c.scale(sx*(1-ex),sy*(1-ex)); sticker(c,w,0,0,128,col,{align:'left',depth:13}); c.restore(); });
    const ct=t-(tI+.45+3*b); if(ct>0){ const p=E.outExpo(clamp(ct/.4)); c.save(); c.globalAlpha=p*(1-prog(t,16*B-.2,16*B)); c.font='700 30px Int'; c.fillStyle='rgba(255,255,255,.85)'; c.fillText('Made for iPad.',1364,880+(1-p)*30); c.restore(); }
    // HEY YO burst
    const hy=t-25.786; if(hy>0 && hy<1.5){ const [sx,sy]=pop(hy,3,.3,.07); const ex=E.inBack(prog(t,26.9,27.2),2); c.save(); c.translate(1150,190); c.rotate(-.12); c.scale(sx*(1-ex),sy*(1-ex));
      c.beginPath(); for(let i=0;i<24;i++){ const a=i*Math.PI/12, r=i%2?120:190+Math.sin(i*3)*12; c.lineTo(Math.cos(a)*r*1.35,Math.sin(a)*r); } c.closePath();
      c.fillStyle='#ffd21e'; c.fill(); c.lineWidth=10; c.strokeStyle=INK; c.stroke(); sticker(c,'HEY YO!',0,30,95,'#ff4fa0',{depth:10}); c.restore();
      burst(c,1150,190,hy,30,88,{speed:1000,grav:900,life:1.2,size:18}); } }
  // orbit icons drawn over device (front half) / behind handled by alpha ordering simplification
  if(back>0){ for(let i=0;i<18;i++){ const a=t*.8+i*Math.PI*2/18; const d=Math.sin(a); const ex=1+E.inBack(prog(t,16*B-.25,16*B),2)*1.5;
      const x=W/2-250+Math.cos(a)*720*ex, y=H/2+20+Math.sin(a)*330*ex; const s=(.55+.35*(d+1)/2)*back*(1+env(CATENV[i],t)*.3);
      c.save(); c.globalAlpha=back*(.55+.45*(d+1)/2); c.translate(x,y); c.rotate(Math.sin(t*2+i)*.2); c.scale(s,s); c.drawImage(IMG['p'+i],-64,-64,128,128); c.restore(); } }
}

// S6 16B → 30s : end card
function scene6(c,t){
  const t0=16*B, tt=t-t0;
  bgNight(c,t,'#24125f');
  const ir=E.outExpo(clamp(tt/.6))*1500; c.save(); c.beginPath(); c.arc(W/2,H*.42,ir,0,7); c.clip(); bgBurst(c,t,W/2,H*.42,t*.12); c.restore();
  // falling pictogram confetti behind
  for(let i=0;i<22;i++){ const st=t0+rnd(i,1)*.5; const u=t-st; if(u<0) continue; const x=rnd(i,2)*W, y=-150+u*(260+rnd(i,3)*240)+ (i%3)*60; const s=.45+rnd(i,4)*.4;
    c.save(); c.globalAlpha=.85; c.translate(x+Math.sin(u*2+i)*40,y); c.rotate(u*(rnd(i,5)-.5)*3); c.scale(s,s); c.drawImage(IMG['p'+(i%18)],-64,-64,128,128); c.restore(); }
  ring(c,W/2,H*.42,tt,'#fff',1000,.8,34); ring(c,W/2,H*.42,tt-.07,'#ffd21e',1200,1,16);
  burst(c,W/2,H*.42,tt,46,99,{speed:1700,grav:1300,life:1.6,size:22});
  const [sx,sy,s]=pop(tt,2.4,.32,.07); const bob=Math.sin(t*Math.PI/b)*7*(1-prog(t,28.8,30)*.6);
  drawHero(c,{x:W/2,y:H*.5+bob+(1-s)*200,s:.52*s,sx:sx/(s||1),sy:sy/(s||1),rot:(1-spring(tt,1.6,.3))*-.5+Math.sin(t*1.6)*.03});
  const cols=['#ffd21e','#ff7a2a','#ff4fa0','#36c95c','#ffffff','#a047f2'];
  letters(c,'Groove',W/2,905,200,t0+.12,b/4,cols,{t,depth:18});
  const tg=E.outExpo(prog(t,t0+.12+b*2,t0+.12+b*2+.5));
  c.save(); c.globalAlpha=tg; c.font='800 40px Int'; c.textAlign='center'; c.fillStyle=INK; c.fillText('Make music in blocks · for iPad',W/2+3,990+(1-tg)*30+3); c.fillStyle='#fff'; c.fillText('Make music in blocks · for iPad',W/2,990+(1-tg)*30); c.restore();
}

// stripe wipe in category colours: cover p 0→1, then uncover 1→2
function stripeWipe(c,p){ if(p<=0||p>=2) return; const n=9, sk=420; c.save();
  for(let i=0;i<n;i++){ const d=i*.06; const a=E.inOutCubic(clamp((p-d)/.7)), z=E.inOutCubic(clamp((p-1-d)/.7));
    const bw=(W+sk*2)/n+2; const x0=-sk+i*bw; const y1=lerp(-80,H+80,z), y2=lerp(-80,H+80,a);
    if(y2<=y1) continue; c.fillStyle=CAT[[0,2,3,11,15,12,8,1,13][i]]; c.beginPath();
    c.moveTo(x0+sk*(y1/H),y1); c.lineTo(x0+bw+sk*(y1/H),y1); c.lineTo(x0+bw+sk*(y2/H),y2); c.lineTo(x0+sk*(y2/H),y2); c.closePath(); c.fill(); }
  c.restore(); }

// ───────── post effects ─────────
const grain=[]; for(let g=0;g<4;g++){ const n=mk(256,256), x=n.getContext('2d'), d=x.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; } x.putImageData(d,0,0); grain.push(n); }
function post(c,t){
  // flashes on impacts
  const hits=[[2*B,.7],[10*B,.85],[16*B,.75]]; let fl=0, ca=0;
  for(const [h,a] of hits){ const tt=t-h; if(tt>=0&&tt<.5){ fl=Math.max(fl,a*Math.exp(-tt*15)); ca=Math.max(ca,a*Math.exp(-tt*6)); } }
  ca=Math.max(ca, E.inCubic(prog(t,15.43,16.71))*.8*(t<16.71?1:0));
  if(ca>.02){ // chromatic split
    tctx.globalCompositeOperation='copy'; tctx.drawImage(buf,0,0); const off=ca*18;
    c.save(); c.globalCompositeOperation='multiply'; c.fillStyle='#00ffff'; c.fillRect(0,0,W,H); // keep G,B
    c.globalCompositeOperation='lighter'; c.globalAlpha=1;
    // red channel copy shifted
    tctx.globalCompositeOperation='multiply'; tctx.fillStyle='#ff0000'; tctx.fillRect(0,0,W,H); tctx.globalCompositeOperation='source-over';
    c.drawImage(tmp,off,0); c.restore(); }
  // vignette
  const v=c.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(4,2,16,${.55+E.inCubic(prog(t,15.43,16.71))*.35})`); c.fillStyle=v; c.fillRect(0,0,W,H);
  // grain
  c.save(); c.globalAlpha=.045; c.globalCompositeOperation='overlay'; const gi=grain[Math.floor(t*24)%4]; c.fillStyle=c.createPattern(gi,'repeat'); c.translate(rnd(Math.floor(t*24))*256,rnd(Math.floor(t*24),2)*256); c.fillRect(-256,-256,W+512,H+512); c.restore();
  if(fl>0){ c.save(); c.globalAlpha=fl; c.fillStyle='#fff'; c.fillRect(0,0,W,H); c.restore(); }
}

// ───────── master timeline ─────────
let tagInfo=null;
function renderScene(t){
  const c=ctx; c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.globalCompositeOperation='source-over';
  if(t<2*B){ scene1(c,t); }
  else if(t<3*B+.3){ // wordmark; whip pan out
    const wp=E.inExpo(prog(t,3*B-.12,3*B+.18));
    if(wp<1){ c.save(); c.translate(-wp*2300,0); const info=scene2(c,t); scene2tag(c,t,info); c.restore(); }
    if(t>3*B-.12){ c.save(); const ip=E.outExpo(prog(t,3*B-.02,3*B+.3)); c.translate((1-ip)*2300,0); scene2b(c,t); c.restore();
      if(wp>.05&&wp<1){ // smear streaks
        c.save(); c.globalAlpha=.35*(1-Math.abs(wp-.5)*2); for(let i=0;i<10;i++){ c.fillStyle=CAT[i]; c.fillRect(0,rnd(i,9)*H,W,6+rnd(i,8)*24);} c.restore(); } }
  }
  else if(t<4*B){ scene2b(c,t); }
  else if(t<6*B){ scene3(c,t); }
  else if(t<8*B){ scene3c(c,t); }
  else if(t<10*B){ scene4(c,t); }
  else if(t<16*B){ scene5(c,t); }
  else scene6(c,t);
  // icons that fly from the FEEL IT shatter over the wipe
  if(t>6.36&&t<4*B+.6){ if(t<4*B){ const st=iconsFly(c,t); st.forEach((s,i)=>{ c.save(); c.translate(s.x,s.y); c.rotate(s.rot); c.scale(s.s,s.s); c.drawImage(IMG['p'+i],-80,-80,160,160); c.restore(); }); } }
  stripeWipe(c,(t-6.2)/.38);
  // transition into the app: card wipe out of scene 3c? (handled by GLOW zoom) ; into end card: stripe
  stripeWipe(c,(t-(16*B-.28))/.26);
  hud(c,t,(1-prog(t,16*B-.3,16*B))*prog(t,.3,1.0)*(t>10*B&&t<10*B+.4?0:1));
  post(c,t);
}
window.renderFrame=function(t,sub=1,shutter=.5){
  octx.globalCompositeOperation='source-over';
  for(let i=0;i<sub;i++){ const st=sub>1?t+((i+.5)/sub-.5)*shutter/FPS:t; renderScene(Math.max(0,st));
    octx.globalAlpha=1/(i+1); octx.drawImage(buf,0,0); }
  octx.globalAlpha=1; return true; };
window.ready=Promise.all(loads).then(()=>document.fonts.load('700 100px Fred')).then(()=>document.fonts.load('800 50px Int')).then(()=>document.fonts.load('700 20px Int')).then(()=>document.fonts.load('500 20px Int')).then(()=>document.fonts.ready).then(()=>{ renderFrame(0); return true; });
