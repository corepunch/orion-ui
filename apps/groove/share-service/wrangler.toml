name = "groove-share"
main = "worker.mjs"
compatibility_date = "2025-04-01"

[assets]
directory = "../../../docs/groove/play"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "SONGS"
bucket_name = "groove-share-private"

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
