name: Platform Builds

# Builds Orion and every application on Linux, macOS and Windows, then packs
# one portable download per app (scripts/bundle-apps.sh). Called by
# build.yml for every push and pull request, and by release.yml, which also
# passes a version to produce the package-manager archives and run the tests.

on:
  workflow_call:
    inputs:
      version:
        description: Release version; empty for a CI build
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    env:
      ORION_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcglm-dev liblua5.4-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libegl-dev libxml2-dev libpng-dev xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cglm lua@5.4 libxml2
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-cglm
            mingw-w64-x86_64-libxml2
            make
            zip
            unzip
      - name: Build
        run: make -j4 all
      - name: Build release packages
        if: inputs.version != ''
        run: sh scripts/package-release.sh "${{ inputs.version }}" "${{ matrix.platform }}" dist
      - name: Build and run tests
        if: inputs.version != ''
        run: make test
      - name: Bundle downloadable apps
        run: sh scripts/bundle-apps.sh "${{ matrix.platform }}" dist
      - name: Check the Linux download runs outside the checkout
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/try" && tar -C "$RUNNER_TEMP/try" -xzf dist/ledger-linux-x86_64.tar.gz
          cd "$RUNNER_TEMP/try"
          HOME="$RUNNER_TEMP/try" xvfb-run -a ./ledger/bin/ledger --screenshot "$RUNNER_TEMP/try/ledger.png"
          test -s "$RUNNER_TEMP/try/ledger.png"
      - name: Check the Windows download carries its DLLs
        if: runner.os == 'Windows'
        run: |
          mkdir -p try-windows && cd try-windows
          unzip -q ../dist/ledger-windows-x86_64.zip
          test -f ledger/bin/ledger.exe && test -f ledger/bin/libkernel.dll && test -d ledger/share/orion
          ! PATH=/usr/bin ldd ledger/bin/ledger.exe | grep -i "not found"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version != '' && 'packages' || 'downloads' }}-${{ matrix.platform }}
          path: dist/*
          retention-days: ${{ inputs.version != '' && 90 || 7 }}
