name: Platform Builds

# Builds Orion and every application on Linux, macOS and Windows, then packs
# one portable download per app (scripts/bundle-apps.sh). Called by
# release.yml, which passes a version to produce the package-manager archives
# and run the tests; run it by hand (workflow_dispatch) to check a branch on
# every platform before a release. Pushes and pull requests build and test on
# Linux only (build.yml: build, test).

on:
  workflow_call:
    inputs:
      version:
        description: Release version; empty for a CI build
        type: string
        default: ''
      desktop_checks_only:
        description: Run the Git Client and Ledger checks in place of the full Linux suite
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04   # 26.04 runners cannot reach security.ubuntu.com for apt (Nov 2026)
            platform: linux-x86_64
          - os: macos-15     # the macos-14 runner configuration is no longer offered (Nov 2026)
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    env:
      ORION_VERSION: ${{ inputs.version }}
      GROOVE_USE_SHINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.os == 'windows-latest' && 'false' || 'recursive' }}
      # libnsbmp's fuzz corpus (test/afl-bmp) has ':' in its file names, which Windows cannot create:
      # check out every other submodule as usual and libnsbmp without its test directory.
      - name: Check out submodules (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git submodule update --init --recursive -- $(git config -f .gitmodules --get-regexp '\.path$' | awk '$2 != "vendor/libnsbmp" {print $2}')
          sha=$(git rev-parse HEAD:vendor/libnsbmp)
          rm -rf vendor/libnsbmp
          git clone --quiet --filter=blob:none --no-checkout "$(git config -f .gitmodules submodule.libnsbmp.url)" vendor/libnsbmp
          git -C vendor/libnsbmp config core.protectNTFS false   # the index may hold them; sparse keeps them off disk
          git -C vendor/libnsbmp sparse-checkout set --no-cone '/*' '!/test/'
          git -C vendor/libnsbmp checkout --quiet "$sha"
          test -f vendor/libnsbmp/src/libnsbmp.c
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcglm-dev liblua5.4-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libegl-dev libxml2-dev libpng-dev xvfb
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cglm lua@5.4 libxml2
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-libxml2
            make
            zip
            unzip
      - name: Build
        run: make -j4 all
      - name: Check Doom-ED WAD imports and geometry
        run: make doom-ed-test
      - name: Render Doom-ED from the standalone checkout
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python3 apps/doom-ed/tests/map_import_test.py build/bin/doom-ed "$RUNNER_TEMP/doom-ed-captures"
      - name: Upload Doom-ED smoke captures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: doom-ed-smoke-captures
          path: ${{ runner.temp }}/doom-ed-captures/*.jpg
      - name: Build release packages
        if: inputs.version != ''
        run: sh scripts/package-release.sh "${{ inputs.version }}" "${{ matrix.platform }}" dist
      - name: Build and run tests (Linux)
        if: inputs.version != '' && runner.os == 'Linux' && !inputs.desktop_checks_only
        run: make test
      - name: Check Git Client and Ledger
        if: inputs.version != '' && (runner.os == 'macOS' || (runner.os == 'Linux' && inputs.desktop_checks_only))
        timeout-minutes: 8
        run: |
          tests=(build/bin/test_gitclient_{backend,ui}_test
                 build/bin/test_ledger{,_addons,_assistant,_automation,_executor,_runtime_forms}_test
                 build/bin/test_db_{access,edit_context,persistence,polymorphic,save_fault}_test
                 build/bin/test_script{,_runtime}_test)
          make -j4 test TEST_BINS="${tests[*]}"
      # Manual runs only: Windows releases are still built untested until this has run green.
      - name: Build and run tests (Windows)
        if: inputs.version == '' && runner.os == 'Windows'
        run: make test
      - name: Check macOS keyboard input and MDI regressions
        if: runner.os == 'macOS'
        run: |
          make build/bin/test_edit_test build/bin/test_owned_window_test build/bin/test_event_loop_test
          build/bin/test_edit_test
          build/bin/test_owned_window_test
          build/bin/test_event_loop_test
      - name: Bundle downloadable apps
        run: sh scripts/bundle-apps.sh "${{ matrix.platform }}" dist
      - name: Check the Linux download runs outside the checkout
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          for app in gitclient ledger; do
            target="$RUNNER_TEMP/try-$app"
            mkdir -p "$target"
            tar -C "$target" -xzf "dist/$app-linux-x86_64.tar.gz"
            (
              cd "$target"
              HOME="$target" xvfb-run -a "./$app/bin/$app" --screenshot "$target/$app.jpg"
            )
            test -s "$target/$app.jpg"
          done
          test -f "$RUNNER_TEMP/try-gitclient/gitclient/lib/gitclient_components.so"
          test -f "$RUNNER_TEMP/try-gitclient/gitclient/lib/terminal_components.so"
      - name: Check the Windows download carries its DLLs
        if: runner.os == 'Windows'
        run: |
          mkdir -p try-windows && cd try-windows
          for app in gitclient ledger; do
            unzip -q "../dist/$app-windows-x86_64.zip"
            test -f "$app/bin/$app.exe"
            test -f "$app/bin/libkernel.dll"
            test -d "$app/share/orion"
            dependencies=$(PATH=/usr/bin ldd "$app/bin/$app.exe")
            if grep -i "not found" <<< "$dependencies"; then exit 1; fi
          done
          test -f gitclient/lib/gitclient_components.dll
          test -f gitclient/lib/terminal_components.dll
      - name: Verify the macOS downloads
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/gitclient-macos-arm64.zip "$RUNNER_TEMP/try-macos"
          ditto -x -k dist/ledger-macos-arm64.zip "$RUNNER_TEMP/try-macos"
          codesign --verify --deep --strict "$RUNNER_TEMP/try-macos/Git Client.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/try-macos/Ledger.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version != '' && 'packages' || 'downloads' }}-${{ matrix.platform }}
          path: dist/*
          retention-days: ${{ inputs.version != '' && 90 || 7 }}
