name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GROOVE_USE_SHINE: "1"

jobs:
  build-linux:
    name: build
    runs-on: ubuntu-24.04   # 26.04 runners cannot reach security.ubuntu.com for apt (Nov 2026)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.4-dev libgl1-mesa-dev libcglm-dev libx11-dev libegl-dev libxml2-dev libpng-dev curl openssl

    - name: Build library
      run: make library

    - name: Build apps
      run: make apps

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: orion-linux
        path: |
          build/lib/liborion.a
          build/lib/liborion.so
          build/lib/libplatform.so
          build/bin/*
        retention-days: 30

  test-linux:
    name: test
    runs-on: ubuntu-24.04   # 26.04 runners cannot reach security.ubuntu.com for apt (Nov 2026)
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ORION_REQUIRE_LOOPBACK_TESTS: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.4-dev libgl1-mesa-dev libcglm-dev libx11-dev libegl-dev libxml2-dev libgl1-mesa-dri libpng-dev lua-check lua5.4 curl openssl

    - name: Check Lua sources
      run: make lua-check

    - name: Check developer SDK
      run: python3 -m unittest discover -s tools/sdk -p 'test_*.py' -v

    - name: Build and run tests
      run: env -u DISPLAY -u WAYLAND_DISPLAY make test

    - name: Check business server and real application hosts
      run: env -u DISPLAY -u WAYLAND_DISPLAY make business-server-check

    - name: Check Doom-ED WAD imports and geometry
      run: make doom-ed-test

    - name: Check XML-generated Ledger API and documentation
      run: make ledger-api-check
