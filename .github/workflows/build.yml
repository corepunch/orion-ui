name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GROOVE_USE_SHINE: "1"

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.4-dev libgl1-mesa-dev libcglm-dev libx11-dev libegl-dev libxml2-dev libpng-dev

    - name: Build library
      run: make library

    - name: Build apps
      run: make apps

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: orion-linux
        path: |
          build/lib/liborion.a
          build/lib/liborion.so
          build/lib/libplatform.so
          build/bin/*
        retention-days: 30

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.4-dev libgl1-mesa-dev libcglm-dev libx11-dev libegl-dev libxml2-dev libgl1-mesa-dri libpng-dev lua-check

    - name: Check Lua sources
      run: make lua-check

    - name: Build and run tests
      run: env -u DISPLAY -u WAYLAND_DISPLAY make test

    - name: Check Doom-ED WAD imports and geometry
      run: make doom-ed-test

    - name: Check XML-generated Ledger API and documentation
      run: make ledger-api-check

  groove-ipad:
    name: Build Groove for iPad Simulator
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build native Groove target
      run: >-
        xcodebuild -project apps/groove/groove.xcodeproj
        -scheme groove-ipad -configuration Debug
        -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
        -derivedDataPath build/groove-ipad-ci CODE_SIGNING_ALLOWED=NO build

    - name: Verify native Apple audio and video exports
      run: |
        clang -std=c11 -fblocks -I. -Wno-deprecated-declarations \
          tests/media_export_apple_test.m orion/kernel/media_export_apple.m orion/kernel/media_export.c \
          -framework AVFoundation -framework AppKit -framework Foundation \
          -framework CoreMedia -framework CoreVideo -o "$RUNNER_TEMP/groove-media-test"
        media_test_dir=$(mktemp -d "$RUNNER_TEMP/groove-media.XXXXXX")
        "$RUNNER_TEMP/groove-media-test" "$media_test_dir"

  platforms:
    name: Downloads
    uses: ./.github/workflows/platform-builds.yml
