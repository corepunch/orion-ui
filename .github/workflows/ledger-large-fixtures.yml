name: Ledger synthetic workloads
on:
  pull_request:
    paths:
      - 'apps/ledger/**'
      - 'tools/ledger-fixture-check.c'
      - 'orion/user/db*'
      - 'Makefile'
      - '.github/workflows/ledger-large-fixtures.yml'
  workflow_dispatch:
jobs:
  workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxml2-dev liblua5.4-dev libgl-dev libegl-dev
      - run: make ledger-large-test OPT=-O2 -j2
