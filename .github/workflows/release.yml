name: Release Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$DISPATCH_VERSION"; fi
          test "$version" = "$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/platform-builds.yml
    with:
      version: ${{ needs.version.outputs.version }}

  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Each platform contributes orion-<pkg>-<version>-<platform>.tar.gz and
  # packages-<platform>.tsv for the package manager, plus version-free
  # <app>-<platform>.{zip,tar.gz} downloads and SHA256SUMS-<platform>.txt;
  # android.yml adds <app>-android-<version>.apk.
  release:
    needs: [version, package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release
          merge-multiple: true
      - name: Verify desktop release assets
        working-directory: release
        run: |
          for app in gitclient ledger; do
            test -s "$app-linux-x86_64.tar.gz"
            test -s "$app-macos-arm64.zip"
            test -s "$app-windows-x86_64.zip"
          done
          sha256sum --check SHA256SUMS-{linux-x86_64,macos-arm64,windows-x86_64}.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Orion ${tag#v}" --generate-notes
          fi
