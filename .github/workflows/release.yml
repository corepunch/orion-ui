name: Release Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          test "$version" = "$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/platform-builds.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # Each platform contributes orion-<pkg>-<version>-<platform>.tar.gz and
  # packages-<platform>.tsv for the package manager, plus version-free
  # <app>-<platform>.{zip,tar.gz} downloads and SHA256SUMS-<platform>.txt.
  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Orion ${tag#v}" --generate-notes
          gh release upload "$tag" release/* --clobber
